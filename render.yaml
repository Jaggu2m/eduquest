# ========================================================
# Render Blueprint Specification for EdQuest AI (Docker)
# https://render.com/docs/blueprint-spec
# ========================================================
version: "1"

databases:
  - name: eduquest-postgres
    databaseName: eduquest
    user: eduquest_user
    plan: starter
    ipAllowList: [] # Only internal services can connect

services:
  # ── Backend Web Service (Docker: Node.js 20, Express, Prisma, pgvector) ──────
  - type: web
    name: eduquest-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: "/api/health"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: eduquest-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: eduquest-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # Set to frontend URL after launch (or * for all origins)
      - key: GROQ_API_KEY
        sync: false # Set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set in Render dashboard

  # ── Redis Key-Value Store (Caching, Pub/Sub, BullMQ queues) ─────────────────
  - type: redis
    name: eduquest-redis
    plan: starter
    ipAllowList: [] # Only internal services can connect
    maxmemoryPolicy: noeviction

  # ── Frontend Web Service (Docker: Multi-stage Vite build + Nginx Alpine) ────
  - type: web
    name: eduquest-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false # Set in Render dashboard to backend URL (e.g. https://eduquest-backend.onrender.com/api)
