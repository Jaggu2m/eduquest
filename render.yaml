# ========================================================
# Render Blueprint Specification for EduQuest AI (100% Free Tier)
# No Credit Card / Payment Info Required
# ========================================================
version: "1"

databases:
  # ── Free PostgreSQL Database with pgvector support ──────────────────────────
  - name: eduquest-postgres
    databaseName: eduquest
    user: eduquest_user
    plan: free
    ipAllowList: [] # Only internal Render services can connect

services:
  # ── Backend Web Service (Docker Container, Free Plan) ────────────────────────
  - type: web
    name: eduquest-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: "/api/health"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: eduquest-postgres
          property: connectionString  # Internal hostname — only reachable from Render network
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false # Optional: paste a free Upstash Redis URL, or leave blank
      - key: ALLOWED_ORIGINS
        sync: false # Set to your frontend URL after first deploy (e.g. https://eduquest-frontend.onrender.com)
      - key: GROQ_API_KEY
        sync: false # Set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set in Render dashboard

  # ── Frontend Static Site (100% Free, Zero Cold Starts, Global CDN) ───────────
  - type: web
    name: eduquest-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        sync: false # Set to backend URL (e.g. https://eduquest-backend.onrender.com/api)

